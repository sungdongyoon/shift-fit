name: 작업 브랜치 PR 생성

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pull-request:
    if: >-
      github.event.deleted == false &&
      github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.ref_name }}
      HEAD_SHA: ${{ github.sha }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: 열린 PR 확인 및 생성
        shell: bash
        run: |
          set -euo pipefail

          # 같은 브랜치의 추가 push는 GitHub가 기존 PR에 자동으로 반영한다.
          existing_pr=$(gh api --method GET "repos/$GH_REPO/pulls" \
            -f state=open \
            -f base="$BASE_BRANCH" \
            -f head="${GH_REPO%%/*}:$HEAD_BRANCH" \
            --jq '.[0].html_url // empty')

          if [[ -n "$existing_pr" ]]; then
            printf '기존 PR에 변경이 반영됩니다: %s\n' "$existing_pr" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ahead_by=$(gh api "repos/$GH_REPO/compare/$BASE_BRANCH...$HEAD_SHA" --jq '.ahead_by')

          if [[ "$ahead_by" -eq 0 ]]; then
            printf '기본 브랜치보다 앞선 커밋이 없어 PR을 생성하지 않습니다.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          title=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA" \
            --jq '.commit.message | split("\n")[0] | .[0:256]')
          body_file="$RUNNER_TEMP/shiftfit-pr-body.md"

          {
            printf '## 변경 내용\n\n'
            printf '`%s` 브랜치에 push한 변경 사항을 `%s`에 반영하기 위한 PR입니다.\n\n' "$HEAD_BRANCH" "$BASE_BRANCH"
            printf '## 검토\n\n'
            printf -- '- Files changed에서 변경 내용을 확인해 주세요.\n'
            printf -- '- 필요한 검사 결과를 확인한 뒤 직접 머지해 주세요.\n'
            printf -- '- 이 워크플로우는 PR 생성만 수행하며 테스트 실행이나 승인·머지는 하지 않습니다.\n'
          } > "$body_file"

          pr_url=$(gh pr create \
            --repo "$GH_REPO" \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --title "$title" \
            --body-file "$body_file")

          printf '검토할 PR을 생성했습니다: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
